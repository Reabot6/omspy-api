version: "3.9"

services:
  postgres:
    container_name: postgres_omspy_test
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: postgres_test
      POSTGRES_USER: user
      POSTGRES_PASSWORD: postgres_test
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres_test:/var/lib/postgresql/data
