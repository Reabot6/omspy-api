[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*

[pytest:env]
DJANGO_TEST=True
APP_NAME=omspy-api
APP_DOMAIN=http://localhost:8000
DJANGO_SECRET_KEY=test-secret-key
DJANGO_DEBUG=True
DJANGO_TEMPLATE_DIR=templates
DJANGO_STATIC_DIR=static
ALLOWED_HOSTS=localhost
CORS_ORIGIN_ALLOW_ALL=True
CORS_ORIGIN_WHITELIST=http://localhost:8000
POSTGRES_HOST=localhost
POSTGRES_PORT=5432
POSTGRES_DB=postgres_test
POSTGRES_USER=user
POSTGRES_PASSWORD=postgres_test
POSTGRES_CONTAINER_NAME=postgres_omspy_test
POSTGRES_MOUNTED_VOLUME=./data/postgres_test
ACCESS_TOKEN_LIFETIME_MINS=30
REFRESH_TOKEN_LIFETIME_DAYS=30
UPDATE_LAST_LOGIN=True
EMAIL_VERIFICATION_CODE_LENGTH=32
EMAIL_VERIFICATION_CODE_LIFETIME_MINS=30
EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend
EMAIL_HOST=smtp.gmail.com
EMAIL_HOST_USER=test@example.com
EMAIL_HOST_PASSWORD=test
EMAIL_PORT=587
EMAIL_USE_TLS=True
MEDIA_ROOT=media
MEDIA_URL=/media/
TENANT_DOMAIN_LENGTH=32
TENANT_INVITATION_CODE_LENGTH=32
TENANT_INVITATION_CODE_LIFETIME_MINS=360
TENANT_INVITATION_CODE_REQUEST_MAX_SIZE=50
FAILED_LOGIN_ATTEMPT_MAX_COUNT=5
LOGIN_LOCK_PERIOD_MINS=30
PASSWORD_RESET_CODE_LENGTH=32
PASSWORD_RESET_CODE_LIFETIME_MINS=30
DRF_THROTTLE_RATES_ANONYMOUS=100/day
DRF_THROTTLE_RATES_USER=1000/day
LOGGER_HANDLERS=console
LOGGER_LEVEL=WARNING
LOGGER_FILE_PATH=/tmp/omspy-api-test.log
